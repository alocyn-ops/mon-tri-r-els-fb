// Gestion de la mémoire locale du Chromebook (historique futur)
let localSaved = JSON.parse(localStorage.getItem('tri88final') || '[]');
if(localSaved.length >= 88) {
    data = localSaved;
}

// Système automatique pour intercepter les futurs envois via la case blanche ou favori
window.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const incomingUrl = params.get('lien');
    const incomingCat = params.get('cat');

    if (incomingUrl && incomingCat) {
        let cleanUrl = incomingUrl;

        document.getElementById('u').value = cleanUrl;
        document.getElementById('catSelect').value = incomingCat;

        let dejavu = data.some(item => item[1] === cleanUrl);

        if (!dejavu) {
            let nextNum = data.length + 1;
            data.push([nextNum, cleanUrl, incomingCat]);
            localStorage.setItem('tri88final', JSON.stringify(data));
        }

        window.history.replaceState({}, document.title, window.location.pathname);
    }

    render();
});

function render(){
    M.innerHTML=''; C.innerHTML=''; D.innerHTML='';
    data.forEach(([n,url,cat])=>{
        let a=document.createElement('a');
        a.href=url; a.target='_blank'; a.textContent=n;
        a.className='b '+(cat=='M'?'m':cat=='C'?'c':'d');
        document.getElementById(cat).appendChild(a);
    });
    cm.textContent=document.getElementById('M').children.length;
    cc.textContent=document.getElementById('C').children.length;
    cd.textContent=document.getElementById('D').children.length;
    tot.textContent="Total : " + data.length + " éléments";
}

function add() {
    let u = document.getElementById('u').value.trim();
    let cat = document.getElementById('catSelect').value;
    if(!u) return;
        let nextNum = data.length + 1;
    data.push([nextNum, u, cat]);
    localStorage.setItem('tri88final', JSON.stringify(data));
    render();
    document.getElementById('u').value = '';
}

function exporter(type) {
    let contenu = "";
    if(type === 'txt') {
        data.forEach(([n,url,cat]) => { contenu += `${n} - [${cat}] - ${url}\n`; });
        telecharger(contenu, "tri_export.txt", "text/plain");
    } else {
        contenu = "Numero,URL,Categorie\n";
        data.forEach(([n,url,cat]) => { contenu += `${n},"${url}",${cat}\n`; });
        telecharger(contenu, "tri_export.csv", "text/csv");
    }
}

function telecharger(texte, nomFichier, typeMime) {
    let blob = new Blob([texte], {type: typeMime});
    let lien = document.createElement("a");
    lien.href = URL.createObjectURL(blob);
    lien.download = nomFichier;
    lien.click();
}
